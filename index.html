<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>AprovaMídia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe
    id="scriptIframe"
    loading="lazy"
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      // URL base do seu Google Apps Script Executável
      const scriptBaseUrl = "https://script.google.com/macros/s/AKfycbxfS2R1nevIkkx2RalCp0l9qvNBbrXgbu0HzZFVl0euIhYt3XAZeptmX2IamoqRL4Lg/exec";
      
      // Captura os parâmetros da URL atual do seu site (ex: ?token=123&status=ok)
      const queryString = window.location.search;
      
      // Combina a URL do script com os parâmetros capturados
      const finalUrl = scriptBaseUrl + queryString;
      
      // Injeta a URL final com o token dentro do iframe
      document.getElementById('scriptIframe').src = finalUrl;
    });
  </script>

</body>
</html>
